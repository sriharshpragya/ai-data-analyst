<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F18F01"/>
      <stop offset="100%" stop-color="#C77300"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#1F4A6B"/>
    </linearGradient>
    <linearGradient id="safetyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D9970"/>
      <stop offset="100%" stop-color="#2A7050"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A23B72"/>
      <stop offset="100%" stop-color="#7A2B55"/>
    </linearGradient>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="900" height="600" fill="#FAFBFC"/>
  
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">
    System Architecture
  </text>
  
  <g filter="url(#shadow)">
    <rect x="350" y="70" width="200" height="60" rx="12" fill="url(#userGrad)"/>
    <text x="450" y="98" text-anchor="middle" fill="white" font-size="16" font-weight="600">
      👤 User
    </text>
    <text x="450" y="118" text-anchor="middle" fill="white" font-size="12" opacity="0.9">
      Web UI · CLI · API
    </text>
  </g>
  
  <line x1="450" y1="130" x2="450" y2="170" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g filter="url(#shadow)">
    <rect x="150" y="170" width="600" height="280" rx="16" fill="white" stroke="#2E86AB" stroke-width="2"/>
    <text x="450" y="200" text-anchor="middle" fill="#2E86AB" font-size="16" font-weight="700">
      🚀 FastAPI Application
    </text>
    
    <rect x="180" y="220" width="540" height="120" rx="10" fill="#FFF7ED" stroke="#F18F01" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="450" y="248" text-anchor="middle" fill="#C77300" font-size="14" font-weight="700">
      🤖 Data Analyst Agent (Multi-Step Reasoning)
    </text>
    
    <g filter="url(#shadow)">
      <rect x="210" y="270" width="150" height="55" rx="8" fill="url(#agentGrad)"/>
      <text x="285" y="292" text-anchor="middle" fill="white" font-size="12" font-weight="600">LLM Reasoning</text>
      <text x="285" y="308" text-anchor="middle" fill="white" font-size="10" opacity="0.9">Planning &amp; Execution</text>
    </g>
    
    <g filter="url(#shadow)">
      <rect x="375" y="270" width="150" height="55" rx="8" fill="url(#agentGrad)"/>
      <text x="450" y="292" text-anchor="middle" fill="white" font-size="12" font-weight="600">Tool Registry</text>
      <text x="450" y="308" text-anchor="middle" fill="white" font-size="10" opacity="0.9">5 tools available</text>
    </g>
    
    <g filter="url(#shadow)">
      <rect x="540" y="270" width="150" height="55" rx="8" fill="url(#agentGrad)"/>
      <text x="615" y="292" text-anchor="middle" fill="white" font-size="12" font-weight="600">Trace Logger</text>
      <text x="615" y="308" text-anchor="middle" fill="white" font-size="10" opacity="0.9">Full observability</text>
    </g>
    
    <g filter="url(#shadow)">
      <rect x="180" y="360" width="220" height="70" rx="10" fill="url(#safetyGrad)"/>
      <text x="290" y="385" text-anchor="middle" fill="white" font-size="14" font-weight="600">🛡️ Safety Layer</text>
      <text x="290" y="405" text-anchor="middle" fill="white" font-size="11" opacity="0.9">Query Validation</text>
      <text x="290" y="420" text-anchor="middle" fill="white" font-size="11" opacity="0.9">Cost Estimation · Timeout</text>
    </g>
    
    <g filter="url(#shadow)">
      <rect x="500" y="360" width="220" height="70" rx="10" fill="url(#chartGrad)"/>
      <text x="610" y="385" text-anchor="middle" fill="white" font-size="14" font-weight="600">📊 Chart Engine</text>
      <text x="610" y="405" text-anchor="middle" fill="white" font-size="11" opacity="0.9">matplotlib</text>
      <text x="610" y="420" text-anchor="middle" fill="white" font-size="11" opacity="0.9">4 chart types</text>
    </g>
  </g>
  
  <line x1="450" y1="450" x2="450" y2="490" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="475" y="475" fill="#64748B" font-size="11" font-style="italic">READ-ONLY</text>
  
  <g filter="url(#shadow)">
    <rect x="300" y="490" width="300" height="80" rx="12" fill="url(#dbGrad)"/>
    <text x="450" y="520" text-anchor="middle" fill="white" font-size="16" font-weight="600">
      🐘 PostgreSQL Database
    </text>
    <text x="450" y="542" text-anchor="middle" fill="white" font-size="12" opacity="0.9">
      Customer Data · Products · Orders
    </text>
    <text x="450" y="558" text-anchor="middle" fill="white" font-size="11" opacity="0.85">
      With schema information_schema
    </text>
  </g>
</svg>
