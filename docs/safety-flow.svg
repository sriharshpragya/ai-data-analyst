<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D9970"/>
      <stop offset="100%" stop-color="#2A7050"/>
    </linearGradient>
    <linearGradient id="userQueryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="executeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E86AB"/>
      <stop offset="100%" stop-color="#1F5F7F"/>
    </linearGradient>
    
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="900" height="750" fill="#FAFBFC"/>
  
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">
    Safety Defense Layers
  </text>
  <text x="450" y="55" text-anchor="middle" font-size="13" fill="#64748B">
    Every query passes through 7 defense layers
  </text>
  
  <g filter="url(#shadow2)">
    <rect x="350" y="80" width="200" height="50" rx="10" fill="url(#userQueryGrad)"/>
    <text x="450" y="110" text-anchor="middle" fill="white" font-size="14" font-weight="600">
      User Query
    </text>
  </g>
  
  <line x1="450" y1="130" x2="450" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <g filter="url(#shadow2)">
    <rect x="200" y="160" width="500" height="55" rx="10" fill="url(#layerGrad)"/>
    <circle cx="235" cy="187" r="18" fill="rgba(255,255,255,0.25)"/>
    <text x="235" y="193" text-anchor="middle" fill="white" font-size="16" font-weight="700">1</text>
    <text x="270" y="185" fill="white" font-size="14" font-weight="600">Query Validation</text>
    <text x="270" y="202" fill="white" font-size="11" opacity="0.9">Length limits · empty check · character sanity</text>
  </g>
  <line x1="450" y1="215" x2="450" y2="240" stroke="#64748B" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <g filter="url(#shadow2)">
    <rect x="200" y="240" width="500" height="55" rx="10" fill="url(#layerGrad)"/>
    <circle cx="235" cy="267" r="18" fill="rgba(255,255,255,0.25)"/>
    <text x="235" y="273" text-anchor="middle" fill="white" font-size="16" font-weight="700">2</text>
    <text x="270" y="265" fill="white" font-size="14" font-weight="600">SQL Parsing</text>
    <text x="270" y="282" fill="white" font-size="11" opacity="0.9">sqlparse structure analysis · statement counting</text>
  </g>
  <line x1="450" y1="295" x2="450" y2="320" stroke="#64748B" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <g filter="url(#shadow2)">
    <rect x="200" y="320" width="500" height="55" rx="10" fill="url(#layerGrad)"/>
    <circle cx="235" cy="347" r="18" fill="rgba(255,255,255,0.25)"/>
    <text x="235" y="353" text-anchor="middle" fill="white" font-size="16" font-weight="700">3</text>
    <text x="270" y="345" fill="white" font-size="14" font-weight="600">Keyword Blocking</text>
    <text x="270" y="362" fill="white" font-size="11" opacity="0.9">35 blocked keywords · whitelist SELECT only</text>
  </g>
  <line x1="450" y1="375" x2="450" y2="400" stroke="#64748B" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <g filter="url(#shadow2)">
    <rect x="200" y="400" width="500" height="55" rx="10" fill="url(#layerGrad)"/>
    <circle cx="235" cy="427" r="18" fill="rgba(255,255,255,0.25)"/>
    <text x="235" y="433" text-anchor="middle" fill="white" font-size="16" font-weight="700">4</text>
    <text x="270" y="425" fill="white" font-size="14" font-weight="600">Pattern Matching</text>
    <text x="270" y="442" fill="white" font-size="11" opacity="0.9">SQL injection · system tables · dangerous functions</text>
  </g>
  <line x1="450" y1="455" x2="450" y2="480" stroke="#64748B" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <g filter="url(#shadow2)">
    <rect x="200" y="480" width="500" height="55" rx="10" fill="url(#layerGrad)"/>
    <circle cx="235" cy="507" r="18" fill="rgba(255,255,255,0.25)"/>
    <text x="235" y="513" text-anchor="middle" fill="white" font-size="16" font-weight="700">5</text>
    <text x="270" y="505" fill="white" font-size="14" font-weight="600">Cost Estimation</text>
    <text x="270" y="522" fill="white" font-size="11" opacity="0.9">PostgreSQL EXPLAIN · reject expensive queries</text>
  </g>
  <line x1="450" y1="535" x2="450" y2="560" stroke="#64748B" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <g filter="url(#shadow2)">
    <rect x="200" y="560" width="500" height="55" rx="10" fill="url(#layerGrad)"/>
    <circle cx="235" cy="587" r="18" fill="rgba(255,255,255,0.25)"/>
    <text x="235" y="593" text-anchor="middle" fill="white" font-size="16" font-weight="700">6</text>
    <text x="270" y="585" fill="white" font-size="14" font-weight="600">Timeout Enforcement</text>
    <text x="270" y="602" fill="white" font-size="11" opacity="0.9">10-second maximum execution time</text>
  </g>
  <line x1="450" y1="615" x2="450" y2="640" stroke="#64748B" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <g filter="url(#shadow2)">
    <rect x="200" y="640" width="500" height="55" rx="10" fill="url(#layerGrad)"/>
    <circle cx="235" cy="667" r="18" fill="rgba(255,255,255,0.25)"/>
    <text x="235" y="673" text-anchor="middle" fill="white" font-size="16" font-weight="700">7</text>
    <text x="270" y="665" fill="white" font-size="14" font-weight="600">LIMIT Injection</text>
    <text x="270" y="682" fill="white" font-size="11" opacity="0.9">Auto-inject 100 default · cap at 1000 max</text>
  </g>
  <line x1="450" y1="695" x2="450" y2="710" stroke="#64748B" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <g filter="url(#shadow2)">
    <rect x="330" y="710" width="240" height="35" rx="8" fill="url(#executeGrad)"/>
    <text x="450" y="732" text-anchor="middle" fill="white" font-size="14" font-weight="700">
      ✅ Safe Execution
    </text>
  </g>
</svg>
